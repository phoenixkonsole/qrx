[package]
name = "qrx-btc-wallet-service"
version = "1.0.0"
description = "Shared QRX Bitcoin wallet sidecar service"
authors = ["OpenAI"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdk = { version = "0.29", features = ["all-keys", "electrum"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
miniscript = { version = "10.2.3", features = ["std"] }
